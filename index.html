<body class="splash-on">
<!-- SPLASH: pantalla de entrada mientras carga el portafolio (shared/main.js la retira) -->
<div class="splash" id="splash" role="img" aria-label="Nova">
  <!-- "Nova" se escribe en cursiva letra por letra (trazo y luego relleno) y una línea fina aparece debajo -->
  <div class="sp-in">
    <svg class="sp-svg" viewBox="0 0 600 260" aria-hidden="true">
      <text class="sp-word" id="spWord" x="300" y="190" text-anchor="middle">Nova</text>
    </svg>
    <span class="sp-line" aria-hidden="true"></span>
  </div>
</div>
<script>
  // cuando la letra cursiva ya cargó (máx. 1.5 s de espera), cada letra se separa en su propio <text>
  // en la misma posición que ocupa dentro de la palabra, para animarlas una tras otra.
  // main.js lee data-go para saber cuándo termina.
  (function () {
    var sp = document.getElementById('splash'), word = document.getElementById('spWord');
    var go = function () {
      if (sp.dataset.go) return;
      try {
        var txt = word.textContent, svgNS = 'http://www.w3.org/2000/svg';
        for (var i = 0; i < txt.length; i++) {
          var p = word.getStartPositionOfChar(i), t = document.createElementNS(svgNS, 'text');
          t.setAttribute('x', p.x); t.setAttribute('y', p.y); t.setAttribute('class', 'sp-l');
          t.style.setProperty('--d', (i * .42) + 's'); t.textContent = txt[i];
          word.parentNode.appendChild(t);
        }
        word.style.display = 'none';
      } catch (e) { word.classList.add('sp-plain'); }
      sp.dataset.go = performance.now(); sp.classList.add('go');
    };
    (document.fonts && document.fonts.load ? document.fonts.load('250px "Pinyon Script"') : Promise.resolve()).then(go, go);
    setTimeout(go, 1500);
  })();
</script>
